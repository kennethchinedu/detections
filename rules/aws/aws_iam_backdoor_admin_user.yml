title: AWS IAM User Created
id: 82ac5778-c3b5-453d-b9c5-0cfdae34285b
name: aws_iam_user_created
status: experimental
description: Detects creation of an IAM user.
author: Kenneth Chinedu
date: 2026-11-15

logsource:
  product: aws
  service: cloudtrail

detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: CreateUser
  condition: selection

level: low

