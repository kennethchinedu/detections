title: AWS CloudTrail Logging Tampering
id: 7f3a9c21-8d64-4b52-ae91-6c2f0d8b1e45
status: experimental
description: Detects attempts to disable or modify AWS CloudTrail logging configuration.
author: Kenneth Chinedu
date: 2026-11-14

tags:
  - attack.defense-evasion
  - attack.t1562.008

logsource:
  product: aws
  service: cloudtrail

detection:
  selection:
    eventSource: cloudtrail.amazonaws.com
    eventName:
      - StopLogging
      - DeleteTrail
      - UpdateTrail
      - PutEventSelectors

  filter_services:
    userIdentity.arn|contains: 'AWSServiceRoleFor'

  condition: selection and not filter_services

falsepositives:
  - AWS Control Tower automation updating CloudTrail trails as part of normal account governance.
  - An authorised administrator performing planned detection testing under an approved change ticket.

level: high
